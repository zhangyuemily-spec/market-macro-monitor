name: Macro Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests icalendar python-dateutil urllib3
      - name: Run script
        env:
          SERVER_SENDKEY: ${{ secrets.SERVER_SENDKEY }}
        run: python macro_monitor.py