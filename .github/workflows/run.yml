name: Market Monitor
on:
  schedule:
    # UTC时间，比北京时间晚8小时；UTC0点=北京时间早上8点，周一到周五执行
    - cron: "0 0 * * 1-5"
  workflow_dispatch: # 网页可以手动点按钮测试

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests
      - name: 运行监控脚本
        env:
          SERVER_SENDKEY: ${{ secrets.SERVER_SENDKEY }}
        run: python macro_monitor.py
